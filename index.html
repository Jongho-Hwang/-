<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>필수안전수칙 교육</title>
  <style>
    :root{--bg:#cfe8f6; --card:#d6ecfa; --title:#46afff; --btn:#123b7a; --text:#0b2d3e}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,Arial}
    .wrap{max-width:820px;margin:0 auto;padding:22px 14px}
    .panel{background:var(--card);border-radius:34px;margin:18px 0;padding:26px 18px 30px;box-shadow:0 6px 16px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.06)}
    .title{font-size:56px;font-weight:900;text-align:center;color:var(--title);margin:4px 0 18px;
      -webkit-text-stroke:10px rgba(255,255,255,.7); text-shadow: 0 7px 0 rgba(255,255,255,.85);}
    .title span{position:relative; -webkit-text-stroke:0; text-shadow:none}
    .field{width:100%;padding:16px 16px;border-radius:20px;border:0;background:#fff;font-size:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
    .field::placeholder{color:#96a6b3}
    .row{display:grid;grid-template-columns:1fr;gap:14px}
    .btn{display:block;width:100%;padding:18px;border-radius:18px;border:0;background:var(--btn);color:#fff;font-weight:800;font-size:20px;opacity:.5;cursor:not-allowed;transition:.2s}
    .btn.enabled{opacity:1;cursor:pointer}
    .muted{color:#445566;opacity:.85;font-size:14px;margin-top:10px}
    .footer{display:flex;justify-content:center;align-items:center;margin-top:18px}
    .logo{width:160px;opacity:.9}
    .yt-holder{position:relative;width:100%;padding-top:56.25%;border-radius:20px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.12);background:#000}
    .yt-holder iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .hidden{display:none}
    .section{margin-top:18px}
    iframe.forms{width:100%;height:720px;border:0;border-radius:16px;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.08)}
    h3.section-title{font-size:22px;margin:8px 0 12px}
  </style>
</head>
<body>
  <div class="wrap">

    <!-- STEP 1: 소속/이름 입력 -->
    <div class="panel" id="step1">
      <div class="title"><span>필수안전수칙</span></div>
      <div class="row" style="margin-top:26px">
        <input id="org" class="field" placeholder="소속" maxlength="60" autocomplete="organization"/>
        <input id="name" class="field" placeholder="이름" maxlength="20" autocomplete="name"/>
      </div>
      <button id="btnStart" class="btn" style="margin-top:18px">영상 시청하기</button>
      <div class="footer"><img class="logo" src="./assets/xi_logo.png" alt="자이 C&A 로고"/></div>
    </div>

    <!-- STEP 2: 영상 시청 -->
    <div class="panel hidden" id="step2">
      <div class="title"><span>필수안전수칙</span></div>
      <div class="yt-holder" id="ytHolder"><div id="player"></div></div>
      <div class="muted">진행률: <span id="pct">0</span>% (탭 이탈 시 타이머 일시정지, 건너뛰기 제한)</div>
      <button id="btnFinish" class="btn" style="margin-top:22px;">시청 완료</button>
      <div class="footer"><img class="logo" src="./assets/xi_logo.png" alt="자이 C&A 로고"/></div>
    </div>

    <!-- STEP 3: 폼 임베드 -->
    <div class="panel hidden" id="step3">
      <div class="title"><span>필수안전수칙</span></div>
      <div class="section">
        <h3 class="section-title">교육 수료 완료 확인</h3>
        <div class="muted">양식 입력 후 제출 전 화면을 캡쳐하여 휴대전화에 보관해주시기 바랍니다.</div>
      </div>
      <iframe id="formsFrame" class="forms" title="교육 수료 확인 양식"></iframe>
      <div class="footer"><img class="logo" src="./assets/xi_logo.png" alt="자이 C&A 로고"/></div>
    </div>

  </div>

  <script>
  // ===== 설정 =====
  const CONFIG = {
    provider: 'youtube',
    ytVideoId: 'https://youtu.be/OFbewrZy03M', // URL 또는 ID
    formsUrl: 'https://forms.office.com/r/jvWzDVdSHN?embed=true'
  };
  // =================

  // DOM
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const step3 = document.getElementById('step3');
  const org = document.getElementById('org');
  const nameEl = document.getElementById('name');
  const btnStart = document.getElementById('btnStart');
  const btnFinish = document.getElementById('btnFinish');
  const pct = document.getElementById('pct');
  const formsFrame = document.getElementById('formsFrame');

  // 1) 입력 유효성 → 버튼 활성화
  function checkInputs(){
    const ok = org.value.trim() && nameEl.value.trim();
    btnStart.classList.toggle('enabled', ok);
    btnStart.disabled = !ok;
  }
  org.addEventListener('input', checkInputs);
  nameEl.addEventListener('input', checkInputs);
  checkInputs();

  btnStart.addEventListener('click', ()=>{
    step1.classList.add('hidden');
    step2.classList.remove('hidden');
    startYouTube();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  // 2) 유튜브 95% 시청 로직
  let required=0, watched=0, maxAllowed=0, tick=null, ytPlayer=null;
  const visible = ()=> document.visibilityState === 'visible';

  function parseYT(input){
    if(!input) return '';
    const idOnly = input.match(/^[a-zA-Z0-9_-]{11}$/);
    if(idOnly) return idOnly[0];
    let m = input.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/); if(m) return m[1];
    m = input.match(/[?&]v=([a-zA-Z0-9_-]{11})/); if(m) return m[1];
    m = input.match(/\/embed\/([a-zA-Z0-9_-]{11})|\/shorts\/([a-zA-Z0-9_-]{11})/); if(m) return m[1] || m[2];
    return '';
  }

  function ensureYT(){
    if(window.YT && window.YT.Player) return Promise.resolve();
    return new Promise(res=>{
      const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
      window.onYouTubeIframeAPIReady = ()=> res();
    });
  }

  function startYouTube(){
    const id = parseYT(CONFIG.ytVideoId);
    if(!id){ alert('유튜브 주소/ID가 올바르지 않습니다.'); return; }
    ensureYT().then(()=>{
      ytPlayer = new YT.Player('player', {
        videoId: id,
        playerVars: { rel:0, modestbranding:1, playsinline:1 },
        events: { onStateChange: onYTState }
      });
    });
  }

  function onYTState(e){
    const state=e.data; // 0 ended, 1 playing, 2 paused
    if(state===1){
      if(tick) return;
      tick = setInterval(()=>{
        if(!visible()) return;
        const cur = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration() || 0;
        if(!required && dur) required = Math.floor(dur * 0.95);
        watched++;
        if(cur > maxAllowed + 2){ ytPlayer.seekTo(maxAllowed, true); }
        else { maxAllowed = Math.max(maxAllowed, cur); }
        const percent = required ? Math.min(100, Math.floor((watched/required)*100)) : 0;
        pct.textContent = percent;
        if (cur >= (dur - 0.5) && watched >= required){
          btnFinish.classList.add('enabled');
          btnFinish.disabled = false;
        }
      }, 1000);
    } else {
      if(tick){ clearInterval(tick); tick=null; }
    }
  }

  // 3) 폼 임베드 열기
  btnFinish.disabled = true;
  btnFinish.addEventListener('click', ()=>{
    step3.classList.remove('hidden');
    if(!formsFrame.src) formsFrame.src = CONFIG.formsUrl;
    step3.scrollIntoView({behavior:'smooth'});
  });
  </script>
</body>
</html>
